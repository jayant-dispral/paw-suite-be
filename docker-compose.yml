version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: brand-threat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: brand_threat
    volumes:
      - mongo_data:/data/db
    networks:
      - brand-threat-network

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: brand-threat-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - brand-threat-network

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: brand-threat-admin
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      SERVER_PORT: "8080"
      MONGODB_DATABASE_URI: "mongodb://admin:password@mongodb:27017/brand_threat?authSource=admin"
      MONGODB_DATABASE_NAME: brand_threat
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: brand_events
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - brand-threat-network

  data-service:
    build:
      context: .
      dockerfile: services/data-service/Dockerfile
    container_name: brand-threat-data
    restart: unless-stopped
    ports:
      - "3001:8081"
    environment:
      MONGODB_DATABASE_URI: "mongodb://admin:password@mongodb:27017/brand_threat?authSource=admin"
      MONGODB_DATABASE_NAME: brand_threat
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: brand_events
      RABBITMQ_QUEUE: data_service_queue
      RAPIDAPI_HOST: twitter-api45.p.rapidapi.com
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - brand-threat-network

volumes:
  mongo_data:

networks:
  brand-threat-network:
    driver: bridge
