apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: paw-suite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: admin-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        # Existing environment variables
        - name: MONGO_URI
          value: "mongodb://mongo:27017"
        - name: JWT_SECRET
          value: "your-secret-key-change-in-production"
        
        # RabbitMQ Configuration
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: RABBITMQ_EXCHANGE
          value: "brand_events"
        
        # Mock Event Generator (disable in production)
        - name: MOCK_EVENTS_ENABLED
          value: "false"
        - name: MOCK_EVENT_INTERVAL
          value: "5s"
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
