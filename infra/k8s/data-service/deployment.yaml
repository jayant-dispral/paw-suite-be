apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: paw-suite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      containers:
      - name: data-service
        image: data-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        # Existing environment variables
        - name: MONGO_URI
          value: "mongodb://mongo:27017"
        
        # RabbitMQ Configuration
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: RABBITMQ_EXCHANGE
          value: "brand_events"
        - name: RABBITMQ_QUEUE
          value: "data_service_queue"
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
