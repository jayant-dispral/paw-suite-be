apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: paw-suite
data:
  default.conf: |
    upstream admin_service {
      server admin-service:80;
    }

    server {
      listen 80;

      location / {
        proxy_pass http://admin_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
